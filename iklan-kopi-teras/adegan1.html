<script>
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
function el(tag, at, par) { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (par) par.appendChild(e); return e; }
let seed = 20261119;
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const R = (a, b) => a + (b - a) * rnd();

/* ---------- bahan gambar ---------- */
// es batu bening: kotak membulat, sisi miring, gelembung udara, retakan
function esBatu(par, s, warmth = 1) {
  const g = el('g', {}, par);
  const h = s / 2, r = s * .2;
  el('rect', { x: -h, y: -h, width: s, height: s, rx: r, fill: 'url(#gEs)', stroke: '#FFFFFF', 'stroke-width': s * .022, 'stroke-opacity': .9 }, g);
  el('rect', { x: -h, y: -h, width: s, height: s, rx: r, fill: 'url(#gEsHangat)', opacity: warmth }, g);
  el('rect', { x: -h + s * .14, y: -h + s * .14, width: s * .72, height: s * .72, rx: r * .7, fill: '#FFFFFF', 'fill-opacity': .1, stroke: '#FFFFFF', 'stroke-width': s * .02, 'stroke-opacity': .55 }, g);
  el('path', { d: `M${-h + r * .6} ${-h + s * .08}Q${-h + s * .1} ${-h + s * .1} ${-h + s * .08} ${-h + r * .9}L${-h + s * .08} ${h - r * 1.2}`, fill: 'none', stroke: '#FFFFFF', 'stroke-width': s * .05, 'stroke-linecap': 'round', opacity: .95 }, g);
  el('path', { d: `M${-h + r * .9} ${-h + s * .07}L${h - r * 1.1} ${-h + s * .07}`, fill: 'none', stroke: '#FFFFFF', 'stroke-width': s * .035, 'stroke-linecap': 'round', opacity: .85 }, g);
  el('path', { d: `M${-s * .1} ${-s * .05}l${s * .14} ${s * .09}l${s * .03} ${s * .16}M${s * .04} ${s * .04}l${s * .16} ${-s * .06}`, fill: 'none', stroke: '#FFFFFF', 'stroke-width': s * .012, opacity: .75 }, g);
  for (let i = 0; i < 7; i++) el('circle', { cx: R(-h * .6, h * .6), cy: R(-h * .6, h * .6), r: R(s * .008, s * .022), fill: '#FFFFFF', opacity: R(.5, .9) }, g);
  el('ellipse', { cx: h * .42, cy: h * .5, rx: s * .14, ry: s * .07, fill: '#FFFFFF', opacity: .35, transform: `rotate(-30 ${h * .42} ${h * .5})` }, g);
  return g;
}
// butir embun: lensa air (gelap di atas, terang di bawah karena membiaskan cahaya), bayangan, kilau kecil
function tetes(par, x, y, r, o = 1) {
  const g = el('g', { opacity: o }, par);
  el('ellipse', { cx: x + r * .16, cy: y + r * .3, rx: r * .96, ry: r * .92, fill: '#2A1206', opacity: .2 }, g);
  el('ellipse', { cx: x, cy: y, rx: r, ry: r * 1.05, fill: 'url(#gTetes)' }, g);
  if (r > 7) el('path', { d: `M${x - r * .62} ${y + r * .42}Q${x} ${y + r * 1.02} ${x + r * .62} ${y + r * .42}`, fill: 'none', stroke: '#FFFFFF', 'stroke-width': r * .13, 'stroke-linecap': 'round', opacity: .55 }, g);
  el('ellipse', { cx: x - r * .34, cy: y - r * .44, rx: Math.max(.8, r * .22), ry: Math.max(.6, r * .14), fill: '#FFFFFF', opacity: .95, transform: `rotate(-32 ${x - r * .34} ${y - r * .44})` }, g);
  return g;
}
// kabut embun: ribuan titik halus dalam satu path
function kabut(par, x0, x1, y0, y1, n, r0, r1, o) {
  let d = '';
  for (let i = 0; i < n; i++) { const x = R(x0, x1), y = R(y0, y1), r = R(r0, r1); d += `M${(x - r).toFixed(1)} ${y.toFixed(1)}a${r.toFixed(2)} ${r.toFixed(2)} 0 1 0 ${(2 * r).toFixed(2)} 0a${r.toFixed(2)} ${r.toFixed(2)} 0 1 0 ${(-2 * r).toFixed(2)} 0`; }
  return el('path', { d, fill: '#FFFDF8', opacity: o }, par);
}

/* ---------- jam timeline deterministik (untuk potret & render) ---------- */
const DURASI = 4.0;
window.OPENER = { ready: false, W: 1080, H: 1920 };
function paskan() { const s = Math.min(innerWidth / 1080, innerHeight / 1920); $('#stage').style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', paskan); paskan();
document.fonts.ready.then(() => Promise.all(['400 100px Anton', '900 54px Poppins', '800 13px Poppins'].map(f => document.fonts.load(f)))).then(() => {
  const tl = gsap.timeline({ paused: true }); window.AUDIO_PLAN = { vo: [], sfx: [], music: null };
  bangun(tl); tl.to({}, { duration: .001 }, DURASI - .001);
  const seek = t => { tl.pause(); tl.time(Math.min(t, DURASI), false); };
  Object.assign(window.OPENER, { tl, DURATION: DURASI, seek, seekFrame: t => { seek(t); return Promise.resolve(); }, ready: true });
  const Q = new URLSearchParams(location.search);
  if (Q.has('t')) seek(+Q.get('t'));
  else if (!Q.has('render')) { tl.play(0); tl.eventCallback('onComplete', () => setTimeout(() => tl.play(0), 700)); }
  if (Q.has('debug')) { const ui = $('#mft-ui'), sk = $('#sk'), tt = $('#tt'); ui.classList.add('on');
    sk.oninput = () => { seek(sk.value / 1000 * DURASI); };
    $('#pp').onclick = () => tl.paused() ? tl.play() : tl.pause();
    gsap.ticker.add(() => { tt.textContent = tl.time().toFixed(2); if (!tl.paused()) sk.value = tl.time() / DURASI * 1000; }); }
});
