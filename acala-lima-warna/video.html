<!doctype html>

<style>

html,body{margin:0;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#05030f;transform-origin:0 0}
.scene{position:absolute;inset:0;opacity:0;overflow:hidden}
.L{position:absolute;inset:0}
canvas{position:absolute;left:0;top:0;width:1920px;height:1080px}
img{position:absolute;display:block;max-width:none}
svg.mandala{position:absolute;overflow:visible}
svg.mandala .d{stroke-dasharray:1;stroke-dashoffset:1;stroke-linecap:round;stroke-linejoin:round}
.glowGold{filter:drop-shadow(0 0 6px rgba(255,210,110,.9)) drop-shadow(0 0 22px rgba(255,170,40,.55))}
.glow5{filter:drop-shadow(0 0 5px rgba(255,255,255,.7)) drop-shadow(0 0 18px rgba(255,220,150,.5))}
.screen{mix-blend-mode:screen}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
/* teks */
.cap{position:absolute;left:0;right:0;text-align:center;opacity:0}
.cap::before{content:"";position:absolute;left:50%;top:50%;width:1500px;height:330px;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse at center,rgba(8,3,20,.72) 0%,rgba(8,3,20,.45) 45%,rgba(8,3,20,0) 72%);z-index:-1}
.cap .t{font:700 74px/1.1 Cinzel,serif;letter-spacing:.11em;color:#ffe4a0;
  background:linear-gradient(180deg,#fff6d8 0%,#ffd36a 48%,#e09a22 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 3px 0 rgba(90,40,0,.55)) drop-shadow(0 0 18px rgba(255,190,80,.55))}
.cap .s{margin-top:14px;font:italic 500 46px/1.2 Cormorant,serif;color:#fff2d6;letter-spacing:.02em;text-shadow:0 2px 10px rgba(0,0,0,.8)}
/* label adegan 2 */
.lab{position:absolute;left:1160px;top:300px;width:680px;opacity:0}
.lab .k{font:600 34px/1 Cormorant,serif;letter-spacing:.35em;color:rgba(255,255,255,.75)}
.lab .a{margin-top:10px;font:700 128px/1 Cinzel,serif;letter-spacing:.06em}
.lab .ln{height:3px;margin:26px 0 22px;width:560px;transform-origin:0 50%}
.lab .w{font:600 66px/1.1 Cormorant,serif;color:#fff;letter-spacing:.03em;text-shadow:0 2px 12px rgba(0,0,0,.7)}
.lab .n{margin-top:14px;font:italic 500 40px/1.2 Cormorant,serif;color:rgba(255,255,255,.82)}
.fig{transform-origin:50% 100%}
.lab::before{content:"";position:absolute;left:-140px;top:-90px;width:900px;height:560px;background:radial-gradient(ellipse at 40% 50%,rgba(0,0,0,.55) 0%,rgba(0,0,0,.3) 45%,rgba(0,0,0,0) 72%);z-index:-1}
</style>
</head>
<body>
<div id="stage">

  <!-- ADEGAN 1: turunnya lima pelindung -->

  <div class="scene" id="s5">
    <div class="L" style="background:radial-gradient(ellipse at 50% 70%,#2a1a4a 0%,#120a26 50%,#040210 100%)"></div>
    <canvas id="s5b"></canvas>
    <div class="L" style="perspective:1000px;perspective-origin:50% 0%">
      <svg class="mandala glow5 screen" id="m5" style="left:610px;top:760px;width:700px;height:700px;transform:rotateX(78deg);transform-origin:50% 50%"></svg>
    </div>
    <svg id="monk" viewBox="0 0 600 600" style="position:absolute;left:610px;top:380px;width:700px;height:700px;overflow:visible">
      <defs>
        <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a1a1a"/><stop offset="1" stop-color="#220810"/></linearGradient>
        <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe7a8"/><stop offset=".5" stop-color="#ffb347"/><stop offset="1" stop-color="#ff7a2a"/></linearGradient>
        <radialGradient id="skin" cx=".45" cy=".35" r=".7"><stop offset="0" stop-color="#7a4a35"/><stop offset="1" stop-color="#2a140c"/></radialGradient>
        <linearGradient id="cushion" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d89a2a"/><stop offset="1" stop-color="#6b3c08"/></linearGradient>

      <ellipse cx="300" cy="575" rx="250" ry="38" fill="url(#cushion)"/>
      <path d="M78 540 Q300 440 522 540 Q536 590 300 592 Q66 590 78 540Z" fill="url(#robe)" stroke="url(#rim)" stroke-width="3"/>
      <path d="M196 540 Q178 400 222 318 Q300 276 378 318 Q422 400 404 540Z" fill="url(#robe)" stroke="url(#rim)" stroke-width="3"/>
      <path d="M222 318 Q300 300 336 330 Q300 420 250 540 L200 540 Q182 410 222 318Z" fill="#7a2a1a" opacity=".55"/>

      <ellipse cx="300" cy="226" rx="50" ry="58" fill="url(#skin)" stroke="url(#rim)" stroke-width="2.5"/>
      <path d="M276 232 Q284 236 292 232 M308 232 Q316 236 324 232" stroke="#1a0a06" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="300" cy="512" rx="54" ry="20" fill="url(#skin)" stroke="url(#rim)" stroke-width="2"/>

  <!-- ADEGAN AKHIR: lima pelindung bersatu -->
  <div class="scene" id="s6">
    <div class="L" id="s6cam"><img src="assets/penuh.jpg" style="left:-41px;top:0;width:2001px;height:1080px"></div>
    <canvas id="s6b"></canvas>
    <svg class="mandala glow5 screen" id="m6" style="left:510px;top:-120px;width:900px;height:900px"></svg>

  <div id="caps"></div>
  <div id="flash"></div>
  <div id="fade"></div>
</div>

<script src="vendor/gsap.min.js"></script>
<script>
// ====== dasar ======
const W = 1920, H = 1080, TAU = Math.PI * 2, D = 62;
const $ = id => document.getElementById(id);
const R = (i, k = 0) => { const x = Math.sin(i * 127.1 + k * 311.7 + 0.5) * 43758.5453; return x - Math.floor(x); };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const sm = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const lerp = (a, b, p) => a + (b - a) * p;
const V = {};   // nilai yang di-tween timeline, dibaca saat menggambar canvas

// warna lima arah (mengikuti gambar referensi)
const C5 = {
  W: { nama: 'putih',  hex: '#f2f5ff', rgb: [242, 245, 255] },   // Barat · Putih · Logam
  S: { nama: 'merah',  hex: '#ff4326', rgb: [255, 67, 38] },     // Selatan · Merah · Api
  N: { nama: 'biru',   hex: '#3f7dff', rgb: [63, 125, 255] },    // Utara · Biru · Air
  C: { nama: 'kuning', hex: '#ffcf2e', rgb: [255, 207, 46] },    // Tengah · Kuning · Bumi
  E: { nama: 'hijau',  hex: '#2fdc72', rgb: [47, 220, 114] },    // Timur · Hijau · Kayu
};
const rgba = (rgb, a) => `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;
// arah layar: kanan = Timur, atas/belakang = Utara, bawah/depan = Selatan, kiri = Barat
function dirOfAngle(a) { // a: radian, 0 = kanan, positif = searah jarum jam (ke bawah)
  const d = ((a * 180 / Math.PI) % 360 + 360) % 360;
  if (d >= 315 || d < 45) return 'E'; if (d < 135) return 'S'; if (d < 225) return 'W'; return 'N';
}

// sprite cahaya lembut (lebih cepat daripada membuat gradient tiap partikel)
const spriteCache = {};
function sprite(rgb, core = 1) {
  const key = rgb.join(',') + core;
  if (spriteCache[key]) return spriteCache[key];
  const s = document.createElement('canvas'); s.width = s.height = 128;
  const c = s.getContext('2d'), g = c.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, `rgba(${Math.min(255, rgb[0] + 80 * core)},${Math.min(255, rgb[1] + 80 * core)},${Math.min(255, rgb[2] + 80 * core)},1)`);
  g.addColorStop(.25, rgba(rgb, .75)); g.addColorStop(.6, rgba(rgb, .22)); g.addColorStop(1, rgba(rgb, 0));
  c.fillStyle = g; c.fillRect(0, 0, 128, 128);
  return spriteCache[key] = s;
}
function blob(c, rgb, x, y, r, a, core) { if (a <= 0.003 || r <= 0) return; c.globalAlpha = Math.min(1, a); c.drawImage(sprite(rgb, core), x - r, y - r, r * 2, r * 2); c.globalAlpha = 1; }
function glint(c, x, y, r, a) {
  c.save(); c.globalAlpha = a; c.strokeStyle = '#fff'; c.lineWidth = 1.6;
  c.beginPath(); c.moveTo(x - r, y); c.lineTo(x + r, y); c.moveTo(x, y - r); c.lineTo(x, y + r); c.stroke(); c.restore();
  blob(c, [255, 255, 255], x, y, r * .5, a, 1);
}
function ctxOf(id) { const cv = $(id); cv.width = W; cv.height = H; return cv.getContext('2d'); }

// ====== mandala SVG ======
const NS = 'http://www.w3.org/2000/svg';
function el(tag, at, p) { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); p.appendChild(e); return e; }
function arcPath(r, a0, a1) { const p = a => [r * Math.cos(a * Math.PI / 180), r * Math.sin(a * Math.PI / 180)]; const [x0, y0] = p(a0), [x1, y1] = p(a1);
  return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`; }
function petal(r0, r1, w) { const m = (r0 + r1) / 2; return `M${r0} 0 Q${m} ${w} ${r1} 0 Q${m} ${-w} ${r0} 0Z`; }
function palaceSide(s, g) { return [[-s, -s], [-g, -s], [-g, -s - 34], [-g - 14, -s - 34], [-g - 14, -s - 52], [g + 14, -s - 52], [g + 14, -s - 34], [g, -s - 34], [g, -s], [s, -s]]; }
function buildMandala(svg, five) {
  svg.setAttribute('viewBox', '-470 -470 940 940');
  const gold = '#ffd877';
  const col = a => five ? C5[dirOfAngle(a)].hex : gold;
  const S = (c, w) => ({ fill: 'none', stroke: c, 'stroke-width': w, pathLength: 1, class: 'd' });
  const gA = el('g', {}, svg), gB = el('g', {}, svg), gC = el('g', {}, svg);
  if (!five) { el('circle', { r: 446, ...S(gold, 4) }, gA); el('circle', { r: 422, ...S(gold, 1.6) }, gA); }
  else for (const [a0, a1] of [[-135, -45], [-45, 45], [45, 135], [135, 225]]) {
    const c = col((a0 + 45) * Math.PI / 180);
    el('path', { d: arcPath(446, a0 + 3, a1 - 3), ...S(c, 8) }, gA); el('path', { d: arcPath(422, a0 + 3, a1 - 3), ...S(c, 2.4) }, gA);
  }
  for (let i = 0; i < 72; i++) { const a = i / 72 * TAU; el('circle', { cx: (434 * Math.cos(a)).toFixed(1), cy: (434 * Math.sin(a)).toFixed(1), r: 3.4, fill: col(a), class: 'dot' }, gA); }
  for (let i = 0; i < 24; i++) { const a = i / 24 * TAU, x = 396 * Math.cos(a), y = 396 * Math.sin(a);
    el('circle', { cx: x.toFixed(1), cy: y.toFixed(1), r: 16, ...S(col(a), 2) }, gA);
    el('circle', { cx: x.toFixed(1), cy: y.toFixed(1), r: 5.5, fill: col(a), class: 'dot' }, gA); }
  el('circle', { r: 368, ...S(gold, 2.2) }, gA);
  // istana persegi dengan gerbang
  for (let k = 0; k < 4; k++) {
    const rot = k * 90, a = (rot - 90) * Math.PI / 180, c = col(a);
    for (const [s, g, w] of [[300, 62, 3.4], [284, 54, 1.5]]) {
      const pts = palaceSide(s, g).map(([x, y]) => { const r = rot * Math.PI / 180; return [x * Math.cos(r) - y * Math.sin(r), x * Math.sin(r) + y * Math.cos(r)]; });
      el('path', { d: 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L'), ...S(c, w) }, gB);
    }
  }
  for (let i = 0; i < 16; i++) { const a = i * 22.5; el('path', { d: petal(152, 262, 44), transform: `rotate(${a})`, ...S(col(a * Math.PI / 180), 2.4) }, gB); }
  el('circle', { r: 268, ...S(gold, 1.6) }, gB);
  el('circle', { r: 150, ...S(five ? C5.C.hex : gold, 2.6) }, gC);
  for (let i = 0; i < 8; i++) { const a = i * 45 + 22.5; el('path', { d: petal(62, 146, 36), transform: `rotate(${a})`, ...S(five ? C5.C.hex : gold, 2.2) }, gC); }
  el('circle', { r: 60, ...S(five ? C5.C.hex : gold, 3) }, gC);
  const star = []; for (let i = 0; i < 16; i++) { const r = i % 2 ? 22 : 50, a = i / 16 * TAU - Math.PI / 2; star.push((r * Math.cos(a)).toFixed(1) + ' ' + (r * Math.sin(a)).toFixed(1)); }
  el('path', { d: 'M' + star.join(' L') + 'Z', ...S('#fff3c4', 2) }, gC);
  el('circle', { r: 10, fill: '#fff6d8', class: 'dot' }, gC);
  return { svg, gA, gB, gC, d: svg.querySelectorAll('.d'), dots: svg.querySelectorAll('.dot') };
}

// ====== data lima pelindung (adegan 2) ======
const G = [
  { id: 'putih',  arah: 'BARAT',   warna: 'Putih',  elemen: 'Logam', img: 'assets/putih.png',  w: 650,  h: 1060, hd: 1180, cx: 690, rgb: C5.W.rgb, aks: '#e8eefc', bg: 'radial-gradient(ellipse at 36% 45%,#5d6a84 0%,#283044 45%,#0b0e17 100%)', fx: 'logam' },
  { id: 'merah',  arah: 'SELATAN', warna: 'Merah',  elemen: 'Api',   img: 'assets/merah.png',  w: 680,  h: 1110, hd: 1200, cx: 700, rgb: C5.S.rgb, aks: '#ff6a3a', bg: 'radial-gradient(ellipse at 36% 55%,#7a1608 0%,#3a0703 45%,#0e0101 100%)', fx: 'api' },
  { id: 'biru',   arah: 'UTARA',   warna: 'Biru',   elemen: 'Air',   img: 'assets/biru.png',   w: 640,  h: 1060, hd: 1180, cx: 690, rgb: C5.N.rgb, aks: '#6aa2ff', bg: 'radial-gradient(ellipse at 36% 40%,#123f9a 0%,#071d55 45%,#01061a 100%)', fx: 'air' },
  { id: 'kuning', arah: 'TENGAH',  warna: 'Kuning', elemen: 'Bumi',  img: 'assets/kuning-mentah.jpg', w: 1080, h: 1450, hd: 1290, cx: 690, rgb: C5.C.rgb, aks: '#ffd23a', bg: 'radial-gradient(ellipse at 36% 45%,#8a5a06 0%,#3d2502 45%,#120a00 100%)', fx: 'bumi', mask: true },
  { id: 'hijau',  arah: 'TIMUR',   warna: 'Hijau',  elemen: 'Kayu',  img: 'assets/hijau.png',  w: 700,  h: 1110, hd: 1200, cx: 700, rgb: C5.E.rgb, aks: '#4cf08a', bg: 'radial-gradient(ellipse at 36% 50%,#0f6a3e 0%,#06331d 45%,#010d07 100%)', fx: 'kayu' },
];
const ROMAN = ['I', 'II', 'III', 'IV', 'V'];
const T2 = 9, SHOT = 5;
const shotsEl = $('shots');
G.forEach((g, i) => {
  const wd = g.w * g.hd / g.h, left = g.cx - wd / 2, top = H + 120 - g.hd;
  const mask = g.mask ? '-webkit-mask-image:radial-gradient(ellipse 47% 49% at 50% 47%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 47% 49% at 50% 47%,#000 62%,transparent 100%);' : '';
  shotsEl.insertAdjacentHTML('beforeend', `
  <div class="scene" id="g-${g.id}">
    <div class="L" style="background:${g.bg}"></div>
    <canvas id="g-${g.id}-b"></canvas>
    <div class="L fig" id="g-${g.id}-fig"><img src="${g.img}" style="left:${left.toFixed(0)}px;top:${top.toFixed(0)}px;width:${wd.toFixed(0)}px;height:${g.hd}px;${mask}"></div>
    <canvas id="g-${g.id}-f"></canvas>
    <div class="L" style="background:linear-gradient(180deg,rgba(0,0,0,0) 80%,rgba(0,0,0,.3) 100%)"></div>
    <div class="lab" id="g-${g.id}-lab">
      <div class="k">PELINDUNG ${ROMAN[i]}</div>
      <div class="a" style="color:${g.aks};text-shadow:0 0 30px ${rgba(g.rgb, .7)},0 4px 0 rgba(0,0,0,.45)">${g.arah}</div>
      <div class="ln" style="background:linear-gradient(90deg,${g.aks},${rgba(g.rgb, 0)})"></div>
      <div class="w">${g.warna} &nbsp;·&nbsp; ${g.elemen}</div>
      <div class="n">Vidyaraja Acalanatha</div>
    </div>
  </div>`);
});

// figur kecil di lima arah (adegan 3)
const POS3 = [ // arah, x, y kaki, tinggi
  ['N', 'biru', 960, 735, 96], ['W', 'putih', 250, 930, 190], ['E', 'hijau', 1670, 930, 190], ['C', 'kuning', 960, 870, 140], ['S', 'merah', 960, 1078, 210],
];
const srcOf = { putih: ['assets/putih.png', 650, 1060], merah: ['assets/merah.png', 680, 1110], biru: ['assets/biru.png', 640, 1060], hijau: ['assets/hijau.png', 700, 1110], kuning: ['assets/kuning-mentah.jpg', 1080, 1450] };
POS3.forEach(([d, k, x, y, h]) => {
  const [src, w0, h0] = srcOf[k], w = w0 * h / h0;
  const mask = k === 'kuning' ? '-webkit-mask-image:radial-gradient(ellipse 45% 47% at 50% 47%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 45% 47% at 50% 47%,#000 55%,transparent 100%);' : '';
  $('s3figs').insertAdjacentHTML('beforeend', `<img class="mini" src="${src}" style="left:${(x - w / 2).toFixed(0)}px;top:${(y - h).toFixed(0)}px;width:${w.toFixed(0)}px;height:${h}px;opacity:0;filter:drop-shadow(0 0 14px ${rgba(C5[d].rgb, .9)});${mask}">`);
});

// teks
const CAPS = [
  { at: 6.0, dur: 2.7, y: 800, t: 'Lima Vidyaraja Acalanatha', s: 'Lima warna · lima elemen · lima arah' },
  { at: 38.4, dur: 3.2, y: 90, t: 'Melindungi Negeri &amp; Kota', s: 'Mandala lima warna menjadi kubah cahaya' },
  { at: 44.4, dur: 3.2, y: 80, t: 'Simabandhana', s: 'Batas suci yang tak tertembus energi gelap' },
  { at: 50.6, dur: 3.0, y: 80, t: 'Perlindungan Pribadi', s: 'Aura lima warna menyelimuti sang praktisi' },
  { at: 57.4, dur: 3.6, y: 820, t: 'Lima Pelindung Bersatu', s: 'Negeri · Kota · Batas Suci · Praktisi' },
];
CAPS.forEach((c, i) => $('caps').insertAdjacentHTML('beforeend', `<div class="cap" id="cap${i}" style="top:${c.y}px"><div class="t">${c.t.toUpperCase()}</div><div class="s">${c.s}</div></div>`));

// ====== mandala ======
const M1 = buildMandala($('m1'), false), M3 = buildMandala($('m3'), true), M4 = buildMandala($('m4'), true), M5 = buildMandala($('m5'), true), M6 = buildMandala($('m6'), true);

// ====== canvas per adegan ======

// ---- bintang & nebula ----

// ---- adegan 1 ----

function draw1(t) {
  const b = CX.s1b, f = CX.s1f;
  b.clearRect(0, 0, W, H); f.clearRect(0, 0, W, H);
  stars(b, t, 300, 1);
  b.globalCompositeOperation = 'lighter';
  blob(b, [255, 190, 80], 960, 430, 380 + 120 * V.m1glow, .55 * V.m1glow, 1);
  b.globalCompositeOperation = 'source-over';
  // lima bola cahaya turun dari mandala
  f.globalCompositeOperation = 'lighter';
  FIG_IMG.forEach(([x, y, k], i) => {
    const p = clamp(V.orbs * 1.6 - i * .15);
    if (p <= 0 || V.orbFade >= 1) return;
    const e = sm(p), ox = lerp(960, x, e), oy = lerp(430, y, e) - Math.sin(e * Math.PI) * 160;

    blob(f, RGB_OF[k], ox, oy, 150, .9 * a, 1); blob(f, [255, 255, 255], ox, oy, 40, .9 * a, 1);

    for (let j = 0; j <= N * p; j++) { const q = j / N, bx = lerp(base[0], to[0], q) + Math.sin(q * Math.PI) * (d === 'W' ? -120 : d === 'E' ? 120 : 0), by = lerp(base[1], to[1], q);
      blob(f, rgb, bx, by, 46 - q * 18, .22, 1); }
    blob(f, rgb, base[0], base[1], 170, .5 * p, 1);
  });
  // kubah cahaya
  if (V.dome > 0) {
    const cx = 960, cy = 1110, rx = 1180, ry = 820, top = cy - ry * sm(V.dome);
    f.save(); f.beginPath(); f.rect(0, top - 10, W, H); f.clip();
    const cg = f.createConicGradient(-Math.PI / 2, cx, cy - 300);
    cg.addColorStop(0, C5.N.hex); cg.addColorStop(.25, C5.E.hex); cg.addColorStop(.5, C5.S.hex); cg.addColorStop(.75, C5.W.hex); cg.addColorStop(1, C5.N.hex);
    f.globalAlpha = .1 + .05 * Math.sin(u * 3); f.fillStyle = cg; f.beginPath(); f.ellipse(cx, cy, rx, ry, 0, Math.PI, TAU); f.fill();
    f.globalAlpha = .9; f.strokeStyle = cg; f.lineWidth = 10; f.stroke();
    f.globalAlpha = .5; f.lineWidth = 34; f.stroke();
    f.globalAlpha = .35; f.strokeStyle = 'rgba(255,240,200,1)'; f.lineWidth = 1.5;
    for (let k = 1; k < 7; k++) { f.beginPath(); f.ellipse(cx, cy, rx * k / 7, ry, 0, Math.PI, TAU); f.stroke(); }
    for (let k = 1; k < 5; k++) { const yy = cy - ry * k / 5, xx = rx * Math.sqrt(1 - (k / 5) ** 2); f.beginPath(); f.ellipse(cx, yy, xx, xx * .08, 0, 0, TAU); f.stroke(); }
    const sw = ((u - 4) % 2.2) / 2.2; if (u > 4) { f.globalAlpha = .5 * (1 - sw); blob(f, [255, 255, 255], cx - rx + sw * rx * 2, cy - ry * .55, 200, .6 * (1 - sw), 1); }

}

// ---- adegan 4: simabandhana ----
const R4 = { cx: 960, cy: 905, rx: 880, ry: 150 };
const strip = {}; function stripOf(rgb) { const k = rgb.join(); if (strip[k]) return strip[k]; const s = document.createElement('canvas'); s.width = 4; s.height = 256; const c = s.getContext('2d');
  const g = c.createLinearGradient(0, 256, 0, 0); g.addColorStop(0, rgba(rgb, 1)); g.addColorStop(.3, rgba(rgb, .45)); g.addColorStop(1, rgba(rgb, 0)); c.fillStyle = g; c.fillRect(0, 0, 4, 256); return strip[k] = s; }
let _ps; function pillarStrip() { if (_ps) return _ps; const s = document.createElement('canvas'); s.width = 4; s.height = 256; const c = s.getContext('2d'), g = c.createLinearGradient(0, 256, 0, 0), rgb = C5.C.rgb;
  g.addColorStop(0, rgba(rgb, 0)); g.addColorStop(.12, rgba(rgb, 1)); g.addColorStop(.4, rgba(rgb, .45)); g.addColorStop(1, rgba(rgb, 0)); c.fillStyle = g; c.fillRect(0, 0, 4, 256); return _ps = s; }
function ringPt(a, d = 1) { return [R4.cx + Math.cos(a) * R4.rx * d, R4.cy + Math.sin(a) * R4.ry * d]; }
function ringDraw(c, u, front) {
  const order = { N: 0, E: 1, S: 2, W: 3 };
  c.globalCompositeOperation = 'lighter';
  for (let j = 0; j < 360; j += 1.5) {
    const a = j * Math.PI / 180, s = Math.sin(a); if ((s >= 0) !== front) continue;
    const d = dirOfAngle(a), rgb = C5[d].rgb, local = ((j - [270, 0, 90, 180][order[d]] + 45 + 360) % 360) / 90;
    const p = clamp(V.ring * 4 - order[d] * .8 - local * .9); if (p <= 0) continue;
    const [x, y] = ringPt(a);
    blob(c, rgb, x, y, 22, .5 * p, 1);
    const h = 420 * V.wall * (.85 + .15 * Math.sin(a * 6 + u * 2)); if (h > 2) { c.globalAlpha = .12; c.drawImage(stripOf(rgb), x - 6, y - h, 12, h); c.globalAlpha = 1; }
  }
  c.globalCompositeOperation = 'source-over';
}
function draw4(t) {
  const u = t - 42, b = CX.s4b, f = CX.s4f;
  b.clearRect(0, 0, W, H); f.clearRect(0, 0, W, H);
  stars(b, t, 160, .7);
  ringDraw(b, u, false);
  // energi gelap mendekat lalu terpental
  for (let i = 0; i < 20; i++) {
    const th = R(i, 1) * TAU, t0 = 2.4 + R(i, 2) * 2.2, sp = .45 + R(i, 3) * .3, hgt = 80 + R(i, 4) * 300;
    const d = 2.3 - Math.max(0, u - t0) * sp; const hitT = t0 + (2.3 - 1.06) / sp;
    let a = 1, dd = Math.max(d, 1.06);
    if (u > hitT) { const q = (u - hitT) / .7; a = 1 - q; dd = 1.06 + q * .5; if (q < 1) { const [hx, hy] = ringPt(th, 1.04); const rgb = C5[dirOfAngle(th)].rgb;
      f.globalCompositeOperation = 'lighter'; blob(f, rgb, hx, hy - hgt * .4, 160 * (1 - q * .5), .9 * (1 - q), 1); blob(f, [255, 255, 255], hx, hy - hgt * .4, 50, .9 * (1 - q), 1); f.globalCompositeOperation = 'source-over'; } }
    if (a <= 0 || u < t0 - .5) continue;
    const [x, y] = ringPt(th, dd), Y = y - hgt;
    const cv = Math.sin(th) > 0 ? f : b;
    for (let k = 0; k < 5; k++) { cv.globalAlpha = .55 * a; cv.fillStyle = k % 2 ? 'rgba(40,0,50,1)' : 'rgba(10,0,15,1)'; cv.beginPath(); cv.arc(x + Math.sin(u * 2 + k * 1.7 + i) * 26, Y + Math.cos(u * 1.6 + k * 2.1) * 20, 40 + k * 6, 0, TAU); cv.fill(); }
    cv.globalAlpha = 1; cv.globalCompositeOperation = 'lighter'; blob(cv, [140, 20, 160], x, Y, 110, .25 * a, 0); cv.globalCompositeOperation = 'source-over';
  }
  ringDraw(f, u, true);
  // pilar kuning di tengah
  if (V.pillar > 0) { f.globalCompositeOperation = 'lighter'; const h = 700 * sm(V.pillar);
    [[260, .10], [150, .16], [80, .24], [34, .4], [12, .7]].forEach(([w, a]) => { f.globalAlpha = a; f.drawImage(pillarStrip(), 960 - w / 2, 800 - h, w, h); }); f.globalAlpha = 1;
    for (let k = 0; k < 24; k++) { const q = ((u * .4 + R(k, 7)) % 1); blob(f, [255, 240, 170], 960 + Math.sin(k * 3 + u) * 30, 760 - q * h, 10, .7 * (1 - q), 1); }
    blob(f, C5.C.rgb, 960, 700, 240, .45 * V.pillar, 1); f.globalCompositeOperation = 'source-over'; }
}

// ---- adegan 5: praktisi ----
const ORB5 = [['W', 400, 700], ['N', 564, 360], ['C', 960, 210], ['S', 1356, 360], ['E', 1520, 700]];
const HEART = [960, 800];
function bez(p0, p1, p2, q) { return [lerp(lerp(p0[0], p1[0], q), lerp(p1[0], p2[0], q), q), lerp(lerp(p0[1], p1[1], q), lerp(p1[1], p2[1], q), q)]; }
function draw5(t) {
  const u = t - 48, b = CX.s5b, f = CX.s5f;
  b.clearRect(0, 0, W, H); f.clearRect(0, 0, W, H);
  stars(b, t, 220, .8);
  b.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 18; i++) blob(b, [255, 200, 140], R(i, 5) * W, R(i, 6) * 700, 30 + R(i, 7) * 60, .08 + .05 * Math.sin(u + i), 0);
  const br = 1 + .035 * Math.sin(u * 1.5);
  const ring = [['C', 230], ['E', 290], ['S', 350], ['N', 410], ['W', 470]];
  ring.forEach(([d, r], i) => { const p = clamp(V.aura * 1.8 - i * .2); if (p <= 0) return; const rgb = C5[d].rgb;
    b.strokeStyle = rgba(rgb, .18 * p); b.lineWidth = 30; b.beginPath(); b.ellipse(960, 790, r * br * sm(p), r * 1.18 * br * sm(p), 0, 0, TAU); b.stroke();
    b.strokeStyle = rgba(rgb, .7 * p); b.lineWidth = 3; b.stroke(); });
  blob(b, [255, 210, 120], 960, 760, 420, .45 * V.aura, 1);
  b.globalCompositeOperation = 'source-over';
  f.globalCompositeOperation = 'lighter';
  ORB5.forEach(([d, x, y], i) => {
    const rgb = C5[d].rgb, pin = clamp(u / .8 - i * .15);
    blob(f, rgb, x, y, 120 + 10 * Math.sin(u * 3 + i), .75 * pin, 1); blob(f, [255, 255, 255], x, y, 30, .8 * pin, 1);
    const p = clamp(V.stream * 1.4 - i * .1); if (p <= 0) return;
    const ctl = [lerp(x, 960, .35), Math.min(y, 300) - 40];
    for (let j = 0; j <= 50 * p; j++) { const q = j / 50, [bx, by] = bez([x, y], ctl, HEART, q); blob(f, rgb, bx, by, 26, .2, 1); }
    for (let k = 0; k < 6; k++) { const q = ((u * .7 + k / 6) % 1) * p; const [bx, by] = bez([x, y], ctl, HEART, q); blob(f, [255, 255, 255], bx, by, 16, .7, 1); }
  });
  if (V.aura > 0) blob(f, [255, 230, 170], HEART[0], HEART[1], 90 * br, .5 * V.aura, 1);

// ---- adegan akhir ----
function draw6(t) {
  const u = t - 54, b = CX.s6b, f = CX.s6f;

  const mc = [960, 330];
  FIG_IMG.forEach(([x, y, k], i) => {
    const rgb = RGB_OF[k], p = clamp(V.streams6 * 1.3 - i * .06); if (p <= 0) return;

    const N = 60;
    for (let j = 0; j <= N * p; j++) { const q = j / N, ang = q * 2.6 * (x < 960 ? 1 : -1), px = lerp(x, mc[0], q), py = lerp(y - 60, mc[1], q) - Math.sin(q * Math.PI) * 140;
      const ox = Math.cos(ang + u) * 30 * (1 - q), oy = Math.sin(ang + u) * 30 * (1 - q);
      blob(f, rgb, px + ox, py + oy, 30 - q * 12, .26, 1); }
    for (let k2 = 0; k2 < 5; k2++) { const q = ((u * .5 + k2 / 5) % 1) * p, px = lerp(x, mc[0], q), py = lerp(y - 60, mc[1], q) - Math.sin(q * Math.PI) * 140; blob(f, [255, 255, 255], px, py, 14, .8, 1); }
  });

// ====== timeline ======
const tl = gsap.timeline({ paused: true });
function inOut(sel, tIn, tOut, d = .6) { tl.set(sel, { opacity: 0 }, 0); tl.to(sel, { opacity: 1, duration: d, ease: 'none' }, tIn); if (tOut != null) tl.to(sel, { opacity: 0, duration: d, ease: 'none' }, tOut); }
function drawM(M, at, dur) { tl.fromTo(M.d, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: dur, ease: 'power2.inOut', stagger: { amount: dur * .6, from: 'random' } }, at);
  tl.fromTo(M.dots, { opacity: 0 }, { opacity: 1, duration: .4, stagger: { amount: dur * .7 } }, at + dur * .2); }

Object.assign(V, { m1glow: 0, orbs: 0, orbFade: 0, aura1: 0, beams: 0, dome: 0, ring: 0, wall: 0, pillar: 0, stream: 0, aura: 0, streams6: 0, glow6: 0 });

// Adegan 1 (0 – 9)

tl.to(V, { orbs: 1, duration: 2.0, ease: 'power1.inOut' }, 2.9);
tl.to('#flash', { opacity: 1, duration: .14, ease: 'none' }, 4.86).to('#flash', { opacity: 0, duration: 1.0, ease: 'power2.out' }, 5.0);
tl.set('#s1img', { opacity: 1 }, 5.0); tl.set(V, { orbFade: 1 }, 5.0);
tl.fromTo('#s1img', { filter: 'brightness(1.8) saturate(.7)' }, { filter: 'brightness(1) saturate(1)', duration: 2.2, ease: 'power2.out' }, 5.0);

// Adegan 2 (9 – 34)
G.forEach((g, i) => {
  const t0 = T2 + i * SHOT, s = `#g-${g.id}`;

  tl.to(`${s}-lab`, { opacity: 0, duration: .4 }, t0 + SHOT - .55);
  tl.to('#flash', { opacity: .55, duration: .12, ease: 'none' }, t0 - .12).to('#flash', { opacity: 0, duration: .5 }, t0);
});

// Adegan 3 (34 – 42)

tl.to(V, { beams: 1, duration: 1.6, ease: 'power1.inOut' }, 36.3);

// Adegan 4 (42 – 48)

// Adegan 5 (48 – 54)

// Adegan akhir (54 – 62)

// teks
CAPS.forEach((c, i) => { const s = `#cap${i}`;
  tl.fromTo(s, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: .7, ease: 'power2.out' }, c.at);
  tl.fromTo(`${s} .t`, { letterSpacing: '.28em' }, { letterSpacing: '.11em', duration: 1.4, ease: 'power3.out' }, c.at);
  tl.to(s, { opacity: 0, duration: .5 }, c.at + c.dur); });
tl.set({}, {}, D);

// ====== menggambar canvas sesuai waktu ======
function vis(id) { return parseFloat(getComputedStyle($(id)).opacity) > .003; }
function draw(t) {
  if (vis('s1')) draw1(t);
  G.forEach((g, i) => { if (vis(`g-${g.id}`)) drawShot(i, t); });
  if (vis('s3')) draw3(t);
  if (vis('s4')) draw4(t);
  if (vis('s5')) draw5(t);
  if (vis('s6')) draw6(t);
}
function seek(t) { tl.seek(t, false); draw(t); }

// ====== mode pratinjau / render ======
const Q = new URLSearchParams(location.search);
function fit() { const s = Q.has('render') ? 1 : Math.min(innerWidth / W, innerHeight / H); $('stage').style.transform = `scale(${s})`; }
fit(); addEventListener('resize', fit);
Promise.all([document.fonts.ready, ...[...document.images].map(im => im.complete ? 1 : new Promise(r => { im.onload = im.onerror = r; }))]).then(() => {
  window.OPENER = { ready: true, DURATION: D, seek };
  window.AUDIO_PLAN = { music: null, sfx: [] };
  if (Q.has('render')) { seek(0); return; }
  if (Q.has('t')) { seek(+Q.get('t')); return; }
  const t0 = performance.now(); (function loop() { const t = ((performance.now() - t0) / 1000) % D; seek(t); requestAnimationFrame(loop); })();
});
