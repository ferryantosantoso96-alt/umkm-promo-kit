<script>
gsap.registerPlugin(MotionPathPlugin);
const NS = 'http://www.w3.org/2000/svg', INK = '#2E2A66';
const $ = s => document.querySelector(s);
function el(tag, at, par) { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (par) par.appendChild(e); return e; }
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const R = (a, b) => a + (b - a) * rnd();
/* kurva halus melalui titik-titik tertutup (Catmull-Rom → Bezier) */
function halus(p) {
  let d = `M${p[0][0].toFixed(1)} ${p[0][1].toFixed(1)}`; const n = p.length;
  for (let i = 0; i < n; i++) { const a = p[(i - 1 + n) % n], b = p[i], c = p[(i + 1) % n], e = p[(i + 2) % n];
    d += `C${(b[0] + (c[0] - a[0]) / 6).toFixed(1)} ${(b[1] + (c[1] - a[1]) / 6).toFixed(1)} ${(c[0] - (e[0] - b[0]) / 6).toFixed(1)} ${(c[1] - (e[1] - b[1]) / 6).toFixed(1)} ${c[0].toFixed(1)} ${c[1].toFixed(1)}`; }
  return d + 'Z';
}
function cincinGoyang(cx, cy, rx, ry, amp, n) { const p = []; for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, k = 1 + R(-amp, amp); p.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]); } return halus(p); }
function bulat(cx, cy, r, amp, n) { return cincinGoyang(cx, cy, r, r, amp, n); }
/* sehelai rambut meruncing dari pangkal (bx,by) ke ujung (tx,ty) */
function helai(bx, by, tx, ty, bend, w) {
  const mx = (bx + tx) / 2, my = (by + ty) / 2, dx = tx - bx, dy = ty - by, L = Math.hypot(dx, dy), nx = -dy / L, ny = dx / L;
  const cx = mx + nx * bend, cy = my + ny * bend;
  return `M${bx + nx * w} ${by + ny * w}Q${cx + nx * w * .6} ${cy + ny * w * .6} ${tx} ${ty}Q${cx - nx * w * .6} ${cy - ny * w * .6} ${bx - nx * w} ${by - ny * w}Z`;
}
function awan(par, s, warna) { const g = el('g', {}, par);
  [[0, 0, 26], [-26, 8, 18], [26, 8, 18], [0, 14, 20]].forEach(([x, y, r]) => el('circle', { cx: x * s, cy: y * s, r: r * s, fill: warna, stroke: INK, 'stroke-width': 4 }, g));
  [[0, 0, 26], [-26, 8, 18], [26, 8, 18], [0, 14, 20]].forEach(([x, y, r]) => el('circle', { cx: x * s, cy: y * s, r: (r - 2.5) * s, fill: warna, class: 'isi' }, g));
  el('circle', { cx: -8 * s, cy: -8 * s, r: 6 * s, fill: '#fff' }, g); return g; }

/* ---------- label nama organ dengan garis penunjuk ---------- */
function label(par, o) {
  const g = el('g', { opacity: 0 }, par);
  const ln = el('path', { d: `M${o.x} ${o.y}L${o.tx} ${o.ty}`, stroke: INK, 'stroke-width': 6, fill: 'none', 'stroke-linecap': 'round' }, g);
  const ln2 = el('path', { d: `M${o.x} ${o.y}L${o.tx} ${o.ty}`, stroke: '#fff', 'stroke-width': 2.5, fill: 'none', 'stroke-linecap': 'round' }, g);
  const dot = el('g', {}, g); el('circle', { cx: o.tx, cy: o.ty, r: 15, fill: '#fff', stroke: INK, 'stroke-width': 5 }, dot); el('circle', { cx: o.tx, cy: o.ty, r: 7, fill: o.warna || '#FF7FAE' }, dot);
  const pill = el('g', {}, g);
  const t = el('text', { x: o.x, y: o.y + 16, 'text-anchor': 'middle', 'font-family': 'Fredoka', 'font-weight': 700, 'font-size': o.fs || 50, fill: INK }, pill); t.textContent = o.teks;
  const bb = t.getBBox(), padX = 30, h = (o.fs || 50) * 1.36;
  const w = bb.width + padX * 2 + 26;
  const r = el('rect', { x: o.x - w / 2, y: o.y - h / 2, width: w, height: h, rx: h / 2, fill: '#fff', stroke: INK, 'stroke-width': 6 }, pill);
  const cap = el('circle', { cx: o.x - w / 2 + 30, cy: o.y, r: 11, fill: o.warna || '#FF7FAE', stroke: INK, 'stroke-width': 4 }, pill);
  t.setAttribute('x', o.x + 13); pill.appendChild(t);
  el('rect', { x: o.x - w / 2 + 6, y: o.y + h / 2 - 2, width: w - 12, height: 9, rx: 4.5, fill: INK, opacity: .25 }, pill).parentNode.insertBefore(pill.lastChild, r);
  const L = Math.hypot(o.tx - o.x, o.ty - o.y);
  [ln, ln2].forEach(p => { p.style.strokeDasharray = L; p.style.strokeDashoffset = L; });
  return { g, ln: [ln, ln2], dot, pill, masuk(tl, at) {
    tl.set(g, { opacity: 1 }, at)
      .from(pill, { scale: 0, svgOrigin: `${o.x} ${o.y}`, duration: .45, ease: 'back.out(2.4)' }, at)
      .to([ln, ln2], { strokeDashoffset: 0, duration: .35, ease: 'power2.out' }, at + .15)
      .from(dot, { scale: 0, svgOrigin: `${o.tx} ${o.ty}`, duration: .35, ease: 'back.out(3)' }, at + .42);
  }, keluar(tl, at) { tl.to(g, { opacity: 0, duration: .25 }, at); } };
}

/* ---------- subtitle tebal ---------- */
function subtitle(tl, list) {
  const box = $('#subs');
  list.forEach(([a, b, s]) => {
    const d = document.createElement('div'); d.className = 'sub';
    let on = false;
    d.innerHTML = s.split(/\s+/).map(w => { let pre = '', post = '';
      if (w.startsWith('*')) { on = true; w = w.slice(1); }
      let body = w; const i = w.indexOf('*');
      if (i >= 0) { body = w.slice(0, i); post = w.slice(i + 1); }

    box.appendChild(d);

      .to(d, { opacity: 0, duration: .14 }, b - .14);
  });
}

function bangun(tl) {

  const cin = $('#cincin'); for (let y = 1018; y < 1196; y += 22) el('path', { d: `M530 ${y}Q540 ${y + 6} 550 ${y}`, fill: 'none' }, cin);

  // kedip lalu pejam saat menghirup

  tl.to(pt.querySelectorAll('.isi'), { attr: { fill: '#FFD2B0' }, duration: .8 }, 7.7)

/* ---------- jam timeline deterministik (untuk potret & render) ---------- */
const DURASI = 45;
window.OPENER = { ready: false, W: 1080, H: 1920 };
function paskan() { const s = Math.min(innerWidth / 1080, innerHeight / 1920); $('#stage').style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', paskan); paskan();
document.fonts.ready.then(() => Promise.all(['700 50px Fredoka', '900 68px Nunito'].map(f => document.fonts.load(f)))).then(() => {
  const tl = gsap.timeline({ paused: true }); window.AUDIO_PLAN = { vo: [], sfx: SFX, music: { src: 'audio/musik.wav', vol: .32 } };
  bangun(tl); tl.to({}, { duration: .001 }, DURASI - .001);
  const seek = t => { tl.pause(); tl.time(Math.min(t, DURASI), false); };
  Object.assign(window.OPENER, { tl, DURATION: DURASI, seek, seekFrame: t => { seek(t); return Promise.resolve(); }, ready: true });
  const Q = new URLSearchParams(location.search);
  if (Q.has('t')) seek(+Q.get('t'));
  else if (!Q.has('render')) { tl.play(0); tl.eventCallback('onComplete', () => setTimeout(() => tl.play(0), 900)); }
  if (Q.has('debug')) { const ui = $('#mft-ui'), sk = $('#sk'), tt = $('#tt'); ui.classList.add('on');
    sk.oninput = () => { seek(sk.value / 1000 * DURASI); };
    $('#pp').onclick = () => tl.paused() ? tl.play() : tl.pause();
    gsap.ticker.add(() => { tt.textContent = tl.time().toFixed(2); if (!tl.paused()) sk.value = tl.time() / DURASI * 1000; }); }
});
