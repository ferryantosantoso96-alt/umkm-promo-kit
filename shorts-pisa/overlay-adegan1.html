<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Overlay Adegan 1</title>
<style>
  @font-face { font-family: "Cormorant"; font-weight: 600; src: url(vendor/fonts/cormorant-garamond-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: "Montserrat"; font-weight: 300; src: url(vendor/fonts/montserrat-latin-300-normal.woff2) format("woff2"); }
  @font-face { font-family: "Montserrat"; font-weight: 200; src: url(vendor/fonts/montserrat-latin-200-normal.woff2) format("woff2"); }
  html, body { margin: 0; width: 1080px; height: 1920px; background: transparent; overflow: hidden; }
  #judul, #sub { position: absolute; left: 0; right: 0; text-align: center; color: #fff; }
  #judul {
    top: 34px; font-family: "Cormorant", serif; font-weight: 600;
    font-size: 76px; line-height: 1.0; letter-spacing: 2px; font-variant-numeric: lining-nums; font-feature-settings: "lnum" 1;
    text-shadow: 0 2px 30px rgba(0,0,0,.55), 0 0 2px rgba(0,0,0,.35);
  }
  #sub {
    top: 212px; font-family: "Montserrat", sans-serif; font-weight: 300;
    font-size: 27px; letter-spacing: 12px; padding-left: 12px;
    text-shadow: 0 2px 18px rgba(0,0,0,.6);
  }
  svg { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="judul">800 TAHUN<br>MELAWAN KERUNTUHAN?</div>
<div id="sub">RAHASIA MENARA MIRING PISA</div>
<svg width="1080" height="1920" viewBox="0 0 1080 1920">
  <!-- garis tegak (pembanding) dan garis sumbu menara; posisi diisi lewat window.GARIS -->
  <line id="tegak" stroke="#ffffff" stroke-width="4" stroke-dasharray="18 14" stroke-linecap="round"/>
  <line id="sumbu" stroke="#f2c46d" stroke-width="4" stroke-linecap="round"/>
  <path id="busur" fill="none" stroke="#ffffff" stroke-width="3"/>
  <text id="lblTegak" fill="#fff" font-family="Montserrat" font-weight="300" font-size="28" letter-spacing="6">TEGAK</text>
  <text id="lblMiring" fill="#f2c46d" font-family="Montserrat" font-weight="300" font-size="28" letter-spacing="6">MIRING</text>
</svg>
<script>
// Geometri garis (px, bingkai 1080×1920), diukur dari frame akhir klip (kamera sudah diam).
// bx,by = pusat dasar menara; tx,ty = pusat ruang lonceng (sumbu menara aktual).
window.GARIS = window.GARIS || { bx: 578, by: 1830, tx: 619, ty: 330 };
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const prog = (t, a, b) => ease(clamp((t - a) / (b - a)));
const $ = id => document.getElementById(id);

// Linimasa (detik, adegan 1 = 9,2 dtk; 8,04 dtk klip + tahan frame akhir):
// 0–4,8 kamera naik menyingkap menara (tanpa teks, biar narasi yang membuka)
// 4,8–6,4 judul & subtitle muncul di langit berawan, di atas puncak menara
// 6,6–8,3 garis tegak vs garis sumbu menara, judul meredup
window.render = function (t) {
  const g = window.GARIS;
  const pj = prog(t, 4.8, 6.0);
  const ps = prog(t, 5.5, 6.5);
  const redup = 1 - 0.4 * prog(t, 6.6, 7.2);
  const J = $('judul'), S = $('sub');
  J.style.opacity = pj * redup;
  J.style.filter = `blur(${(1 - pj) * 14}px)`;
  J.style.letterSpacing = `${2 + (1 - pj) * 16}px`;
  S.style.opacity = ps * 0.92 * redup;
  S.style.transform = `translateY(${(1 - ps) * 12}px)`;

  const len = g.by - g.ty;
  const pt = prog(t, 6.6, 7.4);           // garis tegak tumbuh dari fondasi
  const tg = $('tegak');
  tg.setAttribute('x1', g.bx); tg.setAttribute('y1', g.by);
  tg.setAttribute('x2', g.bx); tg.setAttribute('y2', g.by - len * pt);
  tg.style.opacity = pt > 0 ? 0.8 : 0;
  const pm = prog(t, 7.3, 8.1);           // garis sumbu menara (miring aktual)
  const sm = $('sumbu');
  sm.setAttribute('x1', g.bx); sm.setAttribute('y1', g.by);
  sm.setAttribute('x2', g.bx + (g.tx - g.bx) * pm); sm.setAttribute('y2', g.by + (g.ty - g.by) * pm);
  sm.style.opacity = pm > 0 ? 0.95 : 0;
  $('busur').style.opacity = 0;

  const lt = $('lblTegak'), lm = $('lblMiring');
  lt.setAttribute('text-anchor', 'end'); lt.setAttribute('x', g.bx - 28); lt.setAttribute('y', g.ty - 12);
  lm.setAttribute('x', g.tx + 26); lm.setAttribute('y', g.ty - 12);
  lt.style.opacity = 0.9 * prog(t, 7.0, 7.5);
  lm.style.opacity = prog(t, 7.7, 8.3);
};
window.render(0);
</script>
</body>
</html>
